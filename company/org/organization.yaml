company:
  name: Perf CI
  mission: >
    Build continuous performance engineering
    for distributed data infrastructure.

founder:
  role: human-founder

roles:

  - id: ceo-cto
    name: CEO / CTO
    responsibility: >
      Turn the company mission into a working product and sustainable business.
      Own company strategy, technical strategy, organization, prioritization,
      architecture decisions, integration, release decisions, and escalation.
    reports_to: human-founder

  - id: product-lead
    name: Product Lead
    responsibility: >
      Identify valuable data-infrastructure performance problems and translate
      them into products customers will pay for. Own customer discovery,
      product requirements, roadmap, pricing hypotheses, competitive analysis,
      and positioning.
    reports_to: ceo-cto

  - id: performance-lead
    name: Principal Performance Engineer
    responsibility: >
      Determine whether distributed data system changes improve or degrade
      real workloads and explain why. Own benchmark methodology, workload
      selection, experiment design, regression analysis, statistical analysis,
      and performance modeling.
    reports_to: ceo-cto

  - id: engine-lead
    name: Distributed Data Engine Lead
    responsibility: >
      Provide deep expertise in Spark, Gluten, Trino, and Presto, including
      query execution, query plans, configuration, native/JVM boundaries,
      and engine internals. Support investigation of engine behavior.
    reports_to: performance-lead

  - id: platform-lead
    name: Platform Engineering Lead
    responsibility: >
      Build reliable infrastructure for provisioning, executing, collecting,
      and storing performance experiments across AWS, Kubernetes, EC2,
      Docker, Pulumi, GitHub Actions, and CI/CD systems.
    reports_to: ceo-cto

  - id: qa-lead
    name: Performance QA Lead
    responsibility: >
      Prevent incorrect performance claims through independent validation.
      Validate methodology, reproducibility, environment and data equivalence,
      instability, statistical significance, and AI-generated conclusions.
    reports_to: ceo-cto

