company:
  name: Perf CI
  mission: >
    Build continuous performance engineering
    for distributed data infrastructure.

founder:
  role: human-founder

roles:

  - id: ceo-cto
    title: CEO / CTO
    reports_to: human-founder
    responsibilities:
      - company_strategy
      - technical_strategy
      - organization
      - prioritization
      - integration
      - escalation

  - id: product-lead
    title: Product Lead
    reports_to: ceo-cto
    responsibilities:
      - customer_discovery
      - product_strategy
      - requirements
      - roadmap
      - competitive_analysis

  - id: performance-lead
    title: Principal Performance Engineer
    reports_to: ceo-cto
    responsibilities:
      - benchmark_methodology
      - workload_design
      - experimental_design
      - regression_analysis
      - statistical_analysis
      - performance_modeling

  - id: engine-lead
    title: Distributed Data Engine Lead
    reports_to: performance-lead
    responsibilities:
      - spark
      - gluten
      - trino
      - presto
      - query_execution
      - engine_internals

  - id: platform-lead
    title: Platform Engineering Lead
    reports_to: ceo-cto
    responsibilities:
      - platform
      - orchestration
      - cloud
      - kubernetes
      - ci_cd
      - experiment_execution
      - observability

  - id: qa-lead
    title: Performance QA Lead
    reports_to: ceo-cto
    responsibilities:
      - validation
      - reproducibility
      - regression_gates
      - experiment_integrity
      - adversarial_review

